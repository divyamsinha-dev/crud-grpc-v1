version: "3.8"

services:
  app:
    build: .
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      DB_URL: postgres://user:password@postgres:5432/crud_db?sslmode=disable
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: crud_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
